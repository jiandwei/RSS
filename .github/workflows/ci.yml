name: Test Worker
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm run test:browser
        env:
          READER_SCREENSHOT_DIR: .scratch/browser-previews
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-previews
          path: .scratch/browser-previews
          if-no-files-found: ignore
          retention-days: 7

